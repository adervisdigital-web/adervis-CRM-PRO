<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADERVIS CRM — для видеопродакшн-студий</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://app.adervis.ru">
  <meta property="og:title" content="ADERVIS CRM — для видеопродакшн-студий">
  <meta property="og:description" content="Управляйте сделками, сметами и финансами видеопродакшн студии. Калькулятор КП, воронка продаж, календарь задач.">
  <meta property="og:image" content="https://app.adervis.ru/icon-512.png">
  <meta name="description" content="Управляйте сделками, сметами и финансами видеопродакшн студии. Калькулятор КП, воронка продаж, календарь задач.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ADERVIS CRM — для видеопродакшн-студий">
  <meta name="twitter:description" content="Управляйте сделками, сметами и финансами видеопродакшн студии.">

  <meta name="theme-color" content="#7c3aed">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net unpkg.com mc.yandex.ru; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mc.yandex.ru https://api.vk.com https://vk.com https://api.telegram.org https://generativelanguage.googleapis.com https://api.qrserver.com; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Adervis">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <script src="theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <script src="sw-register.js" defer></script>

  <!-- Yandex.Metrika counter -->
  <script src="metrika.js"></script>
  <noscript><div><img src="https://mc.yandex.ru/watch/109706942" style="position:absolute; left:-9999px;" alt="" /></div></noscript>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/@vkid/sdk@2/dist-sdk/umd/index.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <aside class="app-sidebar" id="appSidebar" aria-label="Боковая навигация"></aside>

    <div class="app-main">
      <header class="topbar">

        <!-- ── Mobile only: brand + burger + horizontal nav ── -->
        <div class="brand">
          <div class="logo" title="Главное меню" onclick="app.openMainMenu()" tabindex="0" role="button">
            <img src="logo-icon.svg" alt="Adervis" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
            <span>A</span>
          </div>
          <div>
            <h1>ADERVIS CRM</h1>
            <p>для видеопродакшна</p>
          </div>
        </div>
        <button class="burger-btn" id="burgerBtn" title="Меню" aria-label="Открыть навигацию">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav" aria-label="Навигация" id="mainNav">
          <button data-view="home" class="nav-icon-btn" title="Сделки"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 0h5v5H9z"/></svg><span class="nav-label">Сделки</span></button>
          <button data-view="deal" id="navEstimateBtn" class="nav-icon-btn estimate-nav-btn" title="Смета"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm1 3v1h8V5H4zm0 3v1h8V8H4zm0 3v1h5v-1H4z"/></svg><span class="nav-label">Смета</span></button>
          <button data-view="packages" class="nav-icon-btn" title="Пакеты"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.2L13 6 8 8.8 3 6l5-2.8zM2 7.4l5 2.8v4.4L2 11.8V7.4zm7 7.2V10.2l5-2.8v4.4L9 14.6z"/></svg><span class="nav-label">Пакеты</span></button>
          <button data-view="global-finances" class="nav-icon-btn" title="Финансы"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.75 4v.52c.91.18 1.5.75 1.5 1.48 0 .9-.74 1.5-1.5 1.65V10c.55-.12 1-.42 1.18-.84l.94.44C10.52 10.5 9.7 11 8.75 11.14V12h-.75v-.84c-.97-.17-1.75-.82-1.75-1.66 0-.93.74-1.52 1.75-1.67V6.52c-.45.1-.82.36-1 .68L6.1 6.8C6.4 6.18 7 5.7 8 5.52V5h.75z"/></svg><span class="nav-label">Финансы</span></button>
          <button data-view="global-calendar" class="nav-icon-btn" title="Календарь"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M5 1v1H2a1 1 0 00-1 1v11a1 1 0 001 1h12a1 1 0 001-1V3a1 1 0 00-1-1h-3V1h-1v1H6V1H5zm8 3v2H3V4h10zm0 3v6H3V7h10z"/></svg><span class="nav-label">Календарь</span></button>
          <button data-view="clients" class="nav-icon-btn" title="Клиенты"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a3 3 0 100 6A3 3 0 008 1zM2 13c0-3 2.7-5 6-5s6 2 6 5H2z"/></svg><span class="nav-label">Клиенты</span></button>
        </nav>

        <!-- ── Desktop only: current page title ── -->
        <div class="topbar-page-title" id="topbarPageTitle"></div>

        <!-- ── Right actions: [поиск][↩][↪][🌙][🔔][+][аватар] ── -->
        <div class="top-actions">
          <span class="autosave-indicator" id="autoSaveIndicator">Сохранено</span>

          <!-- Поиск — первый слева -->
          <button class="topbar-icon-btn" id="searchBtn" title="Поиск (Ctrl+K)" onclick="app.openSearch()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>

          <!-- Undo / Redo -->
          <button class="topbar-icon-btn" id="undoBtn" title="Отменить (Ctrl+Z)" onclick="app.undo()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
          </button>
          <button class="topbar-icon-btn" id="redoBtn" title="Повторить (Ctrl+Y)" onclick="app.redo()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
          </button>

          <!-- Тема -->
          <button class="topbar-icon-btn theme-toggle-btn" id="themeBtn" title="Сменить тему">
            <span class="theme-icon">
              <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </span>
          </button>

          <!-- Уведомления -->
          <button class="notif-btn topbar-icon-btn" id="notifBtn" title="Уведомления" onclick="app.toggleNotifPopup()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notif-badge" id="notifBadge" style="display:none">0</span>
          </button>

          <!-- Создать (круглая + кнопка) -->
          <div class="global-add-wrap">
            <button class="topbar-add-btn" id="globalAddBtn" title="Создать новое">+</button>
            <div class="global-add-menu" id="globalAddMenu">
              <button class="global-add-menu-item" onclick="app.startWizard();app.closeGlobalMenu()">
                <span class="icon" style="background:rgba(124,58,237,.18)">⭑</span>Новая сделка
              </button>
              <div class="global-add-menu-divider"></div>
              <button class="global-add-menu-item" onclick="app.openFinanceModal('payment');app.closeGlobalMenu()">
                <span class="icon" style="background:rgba(22,163,74,.18);color:#86efac">+</span>Поступление
              </button>
              <button class="global-add-menu-item" onclick="app.openFinanceModal('expense');app.closeGlobalMenu()">
                <span class="icon" style="background:rgba(220,38,38,.15);color:#fca5a5">−</span>Расход
              </button>
              <div class="global-add-menu-divider"></div>
              <button class="global-add-menu-item" onclick="app.createTask();app.closeGlobalMenu()">
                <span class="icon" style="background:rgba(8,145,178,.18)">☐</span>Задача
              </button>
              <button class="global-add-menu-item" onclick="app.createClient();app.go('clients');app.closeGlobalMenu()">
                <span class="icon" style="background:rgba(202,138,4,.18)">☺</span>Новый клиент
              </button>
            </div>
          </div>

          <!-- Профиль (аватар + дропдаун: профиль / настройки / подписка / выйти) -->
          <div class="profile-dd-wrap" id="profileDdWrap">
            <button class="profile-avatar-btn" id="profileAvatarBtn" title="Профиль и аккаунт" onclick="app.toggleProfileDd()">
              <span id="profileAvatarInner">A</span>
            </button>
            <div class="profile-dd" id="profileDd"></div>
          </div>

          <!-- Служебные элементы — только для JS -->
          <span id="adminTopbar" style="display:none"></span>
          <button id="clientModeBtn" style="display:none">👁 Клиент</button>
          <div id="helpDdWrap" style="display:none">
            <button id="helpBtn" onclick="app.toggleHelpDd()"></button>
            <div class="help-dd" id="helpDd"></div>
          </div>
        </div>
      </header>

      <main class="container" id="appContent"></main>
      <div id="notifPopupContainer"></div>
      <div id="authGateContainer"></div>
    </div><!-- end app-main -->
  </div><!-- end app -->

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Нижняя навигация">
    <button class="mbn-item" id="mbnHome" onclick="app.go('home')" title="Сделки">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 0h5v5H9z"/></svg>
      Сделки
    </button>
    <button class="mbn-item" id="mbnDeal" onclick="app.go('deal')" title="Смета">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm1 3v1h8V5H4zm0 3v1h8V8H4zm0 3v1h5v-1H4z"/></svg>
      Смета
    </button>
    <button class="mbn-add" id="mbnAdd" onclick="app.startWizard()" title="Новая сделка">+</button>
    <button class="mbn-item" id="mbnFinances" onclick="app.go('global-finances')" title="Финансы">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.75 4v.52c.91.18 1.5.75 1.5 1.48 0 .9-.74 1.5-1.5 1.65V10c.55-.12 1-.42 1.18-.84l.94.44C10.52 10.5 9.7 11 8.75 11.14V12h-.75v-.84c-.97-.17-1.75-.82-1.75-1.66 0-.93.74-1.52 1.75-1.67V6.52c-.45.1-.82.36-1 .68L6.1 6.8C6.4 6.18 7 5.7 8 5.52V5h.75z"/></svg>
      Финансы
    </button>
    <button class="mbn-item" id="mbnMore" onclick="app.openMainMenu()" title="Ещё">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>
      Ещё
    </button>
  </nav>

  <!-- Requisites footer -->
  <footer id="requisitesFooter" style="text-align:center;padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:auto">
    ADERVIS CRM &middot; CRM для видеопродакшн &middot; Самозанятый &middot; ИНН&nbsp;592110786536 &middot;
    <a href="mailto:adervis.digital@gmail.com" style="color:var(--muted)">adervis.digital@gmail.com</a> &middot;
    <a href="https://adervis.ru/docs" target="_blank" rel="noopener" style="color:var(--muted)">Оферта и политика конфиденциальности</a> &middot;
    Доступ предоставляется онлайн сразу после оплаты
  </footer>

  <div id="offlineBanner" class="offline-banner">
    <span>📡 Нет соединения с интернетом — изменения сохраняются локально</span>
  </div>
  <input type="file" id="importJsonInput" accept="application/json" hidden>
  <input type="file" id="importCatalogInput" accept="application/json" hidden>
  <div id="toast" class="toast"></div>
  <div id="printArea"></div>
  <button class="scroll-top-btn" id="scrollTopBtn" title="Наверх">&#8593;</button>
  <div id="vkid-one-tap" style="display:none"></div>

  <!-- Баннер напоминания о подписке -->
  <div id="payBannerContainer"></div>

  <!-- Поисковый оверлей -->
  <div class="search-modal" id="searchModal" style="display:none" onclick="if(event.target===this)app.closeSearch()">
    <div class="search-box">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchInput" placeholder="Поиск по сделкам, клиентам, задачам..." style="flex:1;border:none;background:none;font-size:15px;color:var(--text);outline:none" oninput="app.runSearch(this.value)">
        <kbd style="font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px">Esc</kbd>
      </div>
      <div id="searchResults" style="max-height:380px;overflow-y:auto;padding:8px 0"></div>
    </div>
  </div>
  <div id="modalContainer"></div>

  <script src="app.js"></script>
</body>
</html>
